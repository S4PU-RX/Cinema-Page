<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinemaSite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@200..700&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>
    <header class="main-header">
        <a href="#" class="logo">
            <h1>CinemaLogo</h1>
        </a>

        <nav class="links">
            <ul>
                <li><a>Films</a></li>
                <li><a>Theater</a></li>
                <li><a>Cinema</a></li>
            </ul>
        </nav>

        <div class="right-container">
            <div class="search-bar">

                <input type="text" placeholder="Search Movies" class="input-search">

                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search"
                    viewBox="0 0 16 16">
                    <path
                        d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                </svg>
            </div>

            <div>
                <button class="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-person-fill" viewBox="0 0 16 16">
                        <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6" />
                    </svg>
                </button>
            </div>
        </div>

    </header>
    
    <section class="carrosel-banner">
        <button class="btn prev" onclick="prevMovie();">&#10094;</button>
        <div class="banner">
            <img class="banner-img" src="" alt="Featured film">
        </div>

        <div class="banner-info">
            <h2 id="banner-title">loading...</h2>
            <span id="banner-certification" class="badge-certification">a</span>
            <p id="banner-overview">loading sinopse...</p>
        </div>

        <button class="btn next" onclick="nextMovie();">&#10095;</button>
    </section>

    <section class="movies-row-section">
        <h2>Explore Movies</h2>
        <button class="row-btn prev-btn" onclick="scrollRow('left')">&#10094;</button>
        <div id="movies-row" class="movies-row"></div>
        <button class="row-btn next-btn" onclick="scrollRow('right')">&#10095;</button>
        <h3 id ="movie-row-title" class="movie-row-title">...loading</h3>
    </section>

    <script src="main.js"></script>
</body>

</html>
